[project]
name = "card-gen"
version = "0.1.0"
description = "PydanticAI card generation sidecar for CustomCard"
requires-python = "~=3.12.0"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pillow>=10.4.0",
  "pydantic>=2.10.0",
  "pydantic-ai-slim[anthropic,openai]>=1.0.0",
  "pydantic-settings>=2.7.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["card_gen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
