  <!-- arc of celebratory marks near top edge -->
  <g fill="#c79a3f">
    <circle cx="640" cy="232" r="9" opacity=".8"/>
    <circle cx="760" cy="196" r="7" opacity=".7"/>
    <circle cx="880" cy="176" r="10" opacity=".85"/>
    <circle cx="1000" cy="178" r="7" opacity=".7"/>
    <circle cx="1120" cy="200" r="9" opacity=".8"/>
