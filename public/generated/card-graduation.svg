      <stop offset="0%" stop-color="#2c3a57" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#2c3a57" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gr-br" cx="84%" cy="88%" r="46%">
