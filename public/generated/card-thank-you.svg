<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2100" role="img" aria-label="Thank-you card front artwork">
  <defs>
    <radialGradient id="ty-tr" cx="84%" cy="16%" r="54%">
      <stop offset="0%" stop-color="#5b8a5f" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#5b8a5f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ty-bl" cx="14%" cy="86%" r="48%">
      <stop offset="0%" stop-color="#e0902f" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#e0902f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1500" height="2100" fill="#f9f3e2"/>
  <rect width="1500" height="2100" fill="url(#ty-tr)"/>
  <rect width="1500" height="2100" fill="url(#ty-bl)"/>
  <!-- top-right: citrus slice + sage leaves -->
  <g transform="translate(1210 360)">
    <circle r="118" fill="#e6952f"/>
    <circle r="96" fill="#f4cd8f"/>
    <g stroke="#e6952f" stroke-width="7" opacity=".85">
      <line x1="0" y1="0" x2="0" y2="-92"/><line x1="0" y1="0" x2="80" y2="-46"/><line x1="0" y1="0" x2="80" y2="46"/>
      <line x1="0" y1="0" x2="0" y2="92"/><line x1="0" y1="0" x2="-80" y2="46"/><line x1="0" y1="0" x2="-80" y2="-46"/>
    </g>
    <circle r="20" fill="#e6952f"/>
  </g>
  <g fill="#4f7a5b" opacity=".7">
    <ellipse cx="1050" cy="250" rx="56" ry="22" transform="rotate(-28 1050 250)"/>
    <ellipse cx="1120" cy="520" rx="50" ry="20" transform="rotate(40 1120 520)"/>
    <ellipse cx="1320" cy="540" rx="44" ry="18" transform="rotate(-50 1320 540)"/>
  </g>
  <!-- lower-left sage sprig -->
  <g>
    <path d="M170 1980 C 250 1860, 280 1780, 300 1660" fill="none" stroke="#4f7a5b" stroke-width="8" stroke-linecap="round" opacity=".6"/>
    <g fill="#4f7a5b" opacity=".6">
      <ellipse cx="250" cy="1860" rx="40" ry="16" transform="rotate(54 250 1860)"/>
      <ellipse cx="288" cy="1740" rx="38" ry="15" transform="rotate(72 288 1740)"/>
      <ellipse cx="214" cy="1900" rx="34" ry="14" transform="rotate(30 214 1900)"/>
    </g>
  </g>
