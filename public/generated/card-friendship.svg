      <stop offset="0%" stop-color="#6f88a8" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#6f88a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fr-br" cx="86%" cy="86%" r="50%">
      <stop offset="0%" stop-color="#e3b34c" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#e3b34c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1500" height="2100" fill="#f8f1e1"/>
  <rect width="1500" height="2100" fill="url(#fr-tl)"/>
  <rect width="1500" height="2100" fill="url(#fr-br)"/>
