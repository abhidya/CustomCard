    <path d="M1300 1820 L1320 1884 L1384 1904 L1320 1924 L1300 1988 L1280 1924 L1216 1904 L1280 1884 Z" opacity=".85"/>
    <path d="M1140 1700 L1152 1742 L1194 1754 L1152 1766 L1140 1808 L1128 1766 L1086 1754 L1128 1742 Z" opacity=".7"/>
  </g>
  <!-- small sage leaves near the sparkles -->
  <g fill="#6f8a6a" opacity=".62">
