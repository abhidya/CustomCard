#cookiescript_aboutwrap::-webkit-scrollbar-thumb{
    border-radius: 5px;
}
#cookiescript_injected_fsd #cookiescript_accept,
#cookiescript_injected_fsd #cookiescript_save,
#cookiescript_injected_fsd #cookiescript_reject{
    border-radius: 30px;
}

@media only screen and (max-width: 440px) {
    .cookiescript_fsd_header {
        border-radius: 0;
    }
    .cookiescript_fsd_footer {
        border-radius: 0;
    }
}
@media only screen and (max-width: 440px) {
	#cookiescript_fsd_wrapper {
		width: 100%;
		height: 100%;
		max-height: 100%;
		top: 0;
		border-radius: 0;
		margin: 0;
	}

	.cookiescript_fsd_main_info {
		padding: 13px 20px;
		overflow-y: auto;
		max-height: 140px;
	}
	.cookiescript_fsd_description{
		margin-top: 8px;
	}
	.cookiescript_fsd_tabs > div {
		padding: 6px;
		font-size: 12px;
	}

	.cookiescript_fsd_tabs_content {
		padding: 5px 20px 10px 20px;
	}

	.cookiescript_fsd_cookies_table thead {
		display: none;
	}

	.cookiescript_fsd_cookies_table td {
		display: flex;
		border-bottom: 0px;
	}

	.cookiescript_fsd_cookies_table tr td:last-child {
		border-bottom: 0;
	}

	.cookiescript_fsd_cookies_table td {
		border-top: 0;
	}

	.cookiescript_fsd_cookies_table td::before {
		content: attr(label);
		font-weight: bold;
		width: 120px;
		min-width: 120px;
		text-align: left;
	}

	.cookiescript_fsd_cookies_table td:nth-child(2):before {
		color: #1C1C1C;
	}

	.cookiescript_category_description {
		text-align: left;
	}

	.cookiescript_fsd_cookies_table td:nth-child(1),
	.cookiescript_fsd_cookies_table th:nth-child(1) {
		padding-left: 7px;
		font-weight: bold;
		border-top: 1px solid #e2e2e2;
	}

	.cookiescript_fsd_cookies_table tr:nth-child(1) td:nth-child(1),
	.cookiescript_fsd_cookies_table tr:nth-child(1) th:nth-child(1) {
		border-top: 0px;
	}

	.cookiescript_fsd_cookies_table td:last-child {
		border-bottom: none;
	}

	.cookiescript_fsd_cookies_table tr:nth-child(even) {
		background: #f5f5f5;
	}

	.cookiescript_fsd_cookies_table tr:nth-child(even) td {
		border-bottom: 0px solid #FFF;
	}

	#cookiescript_injected_fsd #cookiescript_buttons {
		margin-bottom: 0;
	}

	#cookiescript_injected_fsd #cookiescript_buttons #cookiescript_accept,
	#cookiescript_injected_fsd #cookiescript_buttons #cookiescript_save,
	#cookiescript_injected_fsd #cookiescript_buttons #cookiescript_reject {
		flex-grow: 1;
		margin-left: 10px;
		margin-right: 10px;
		margin-top: 5px;
		margin-bottom: 5px;
		padding: 0 15px;
	}

	.cookiescript_fsd_language_drop_down {
		right: 40px;
	}

	#cookiescript_injected_fsd #cookiescript_close{
		right:14px;
	}
    .cookiescript_fsd_reportby {
        position: relative;
        bottom: 0;
        right: auto;
        color: #1C1C1C;
        font-size: 12px;
        padding: 0 20px 10px 21px;
        max-width: 100%;
        opacity: 0.8;
        display: none;
    }
    #cookiescript_fsd_reportlink, #cookiescript_fsd_cookiescriptlink{
        color: #1C1C1C;
        font-size: 12px;
    }

    #cookiescript_fsd_wrapper .cookiescript-extra-links{
        flex-direction: column;
    }
    
}

#cookiescript_injected {
bottom: 0;
    left: 0;
    right: 0;
    position: fixed;
    padding: 12px 60px 12px 50px;
    width: 100%;
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    margin: 0;
    max-height: 85%;
    overflow-y: auto;
    align-items: center;
    ;
}

#cookiescript_toppart,#cookiescript_bottompart {
	width: 100%;
}
#cookiescript_toppart{
	display: flex;
	flex-direction: row;
	justify-content: space-between;
    margin: 0;
}
#cookiescript_rightpart {
    display: flex;
    flex-direction: row;
    align-items: center;
	min-width: 33%;
}

.cookiescript-extra-links{
    padding-top:10px;
}
.cookiescript-extra-links a{
    margin-left:0;
    margin-right: 30px;
}

#cookiescript_copyright {
    text-align: left;
    line-height: 1;
    margin:4px 0 0 0;
    position: absolute;
    right: 15px;
    bottom: 4px;
}

#cookiescript_buttons {
    flex-wrap: nowrap;
    justify-content: center;
    margin: 0;
    font-weight: 700;
    width:100%;
	flex-direction: row;
}

#cookiescript_manage_wrap {
    margin: 0 0 3px 0;
	text-align: left;
}
#cookiescript_manage{
    margin-left:0;
}
#cookiescript_header {
    margin: 0 50px 9px 0;
    text-align: left;
    padding: 7px 0 0 0;
}
#cookiescript_checkboxs {
    margin: 0 0 0 -11px;
    display: flex;
    flex-wrap: wrap;
}
.cookiescript_checkbox_label{
    padding: 0;
    margin: 0 10px 0 -2px;
}
.cookiescript_checkbox {
    margin: 0;
}
#cookiescript_accept, #cookiescript_reject, #cookiescript_save {
    margin: 5px 7px;
    flex-shrink: 1;
    padding: 0 17px;
    flex-grow: 1;
}
#cookiescript_description{
    text-align: left;
    font-size: 12px;
    margin: 0;
}
#cookiescript_readmore{
	font-size: 12px;
}
#cookiescript_leftpart {
    display: flex;
    flex-direction: column;
    flex-wrap: nowrap;
    justify-content: center;
    max-width: 65%;
}

#cookiescript_injected.hascookiereport #cookiescript_rightpart{
	align-items:baseline;
}
#cookiescript_leftpart{
	-ms-flex: 0 1 741px;
}
#cookiescript_rightpart, {
	-ms-flex: 0 1 285px;
}
#cookiescript_buttons{
	-ms-flex: 0 1 100%;
