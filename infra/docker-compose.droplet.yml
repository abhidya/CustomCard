services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set CADDY_DOMAIN}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?set CADDY_ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - customcard-caddy-data:/data
      - customcard-caddy-config:/config

  app:
    build:
      context: ..
      target: runtime
    restart: unless-stopped
    expose:
      - "4173"
    environment:
      CUSTOMCARD_ENV: prod
      CUSTOMCARD_API_RUNTIME: postgres
      DATABASE_URL: postgres://customcard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/customcard_prod
      QUEUE_URL: redis://redis:6379/0
      OBJECT_STORE_URL: https://${OBJECT_STORE_HOST:?set OBJECT_STORE_HOST}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?set OBJECT_STORE_BUCKET}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?set OBJECT_STORE_ACCESS_KEY_ID}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set OBJECT_STORE_SECRET_ACCESS_KEY}
      OBJECT_STORE_READ_ACCESS_KEY_ID: ${OBJECT_STORE_READ_ACCESS_KEY_ID:-}
      OBJECT_STORE_READ_SECRET_ACCESS_KEY: ${OBJECT_STORE_READ_SECRET_ACCESS_KEY:-}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_PUBLIC_BASE_URL: https://${CADDY_DOMAIN:?set CADDY_DOMAIN}/api/artifacts
      OBJECT_STORE_SIGNING_SECRET: ${OBJECT_STORE_SIGNING_SECRET:?set OBJECT_STORE_SIGNING_SECRET}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET}
      ARTIFACT_SIGNED_URL_TTL_MINUTES: 15
      SECRET_PROVIDER: managed_secret_store
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ..
      target: runtime
    restart: unless-stopped
    command: npm run worker
    environment:
      CUSTOMCARD_ENV: prod
      CUSTOMCARD_API_RUNTIME: postgres
      DATABASE_URL: postgres://customcard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/customcard_prod
      QUEUE_URL: redis://redis:6379/0
      OBJECT_STORE_URL: https://${OBJECT_STORE_HOST:?set OBJECT_STORE_HOST}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?set OBJECT_STORE_BUCKET}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?set OBJECT_STORE_ACCESS_KEY_ID}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set OBJECT_STORE_SECRET_ACCESS_KEY}
      OBJECT_STORE_READ_ACCESS_KEY_ID: ${OBJECT_STORE_READ_ACCESS_KEY_ID:-}
      OBJECT_STORE_READ_SECRET_ACCESS_KEY: ${OBJECT_STORE_READ_SECRET_ACCESS_KEY:-}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_PUBLIC_BASE_URL: https://${CADDY_DOMAIN:?set CADDY_DOMAIN}/api/artifacts
      OBJECT_STORE_SIGNING_SECRET: ${OBJECT_STORE_SIGNING_SECRET:?set OBJECT_STORE_SIGNING_SECRET}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET}
      ARTIFACT_SIGNED_URL_TTL_MINUTES: 15
      SECRET_PROVIDER: managed_secret_store
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: customcard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: customcard_prod
    volumes:
      - customcard-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - customcard-redis:/data

volumes:
  customcard-postgres:
  customcard-redis:
  customcard-caddy-data:
  customcard-caddy-config:
