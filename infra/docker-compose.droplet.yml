services:
  app:
    build:
      context: ..
      target: runtime
    restart: unless-stopped
    ports:
      - "80:4173"
    environment:
      CUSTOMCARD_ENV: prod
      DATABASE_URL: postgres://customcard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/customcard_prod
      QUEUE_URL: redis://redis:6379/0
      OBJECT_STORE_URL: file:///data/objects
      OBJECT_STORE_SIGNING_SECRET: ${OBJECT_STORE_SIGNING_SECRET:?set OBJECT_STORE_SIGNING_SECRET}
      ARTIFACT_SIGNED_URL_TTL_MINUTES: 15
      SECRET_PROVIDER: managed_secret_store
      REAL_ORDER_KILL_SWITCH: disabled
      WALGREENS_VENDOR_MODE: disabled_until_certified
      CVS_VENDOR_MODE: disabled_until_certified
      FEDEX_VENDOR_MODE: disabled_until_certified
      WALMART_VENDOR_MODE: disabled_until_certified
      STAPLES_VENDOR_MODE: disabled_until_certified
      OFFICE_DEPOT_VENDOR_MODE: disabled_until_certified
    volumes:
      - customcard-objects:/data/objects
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ..
      target: runtime
    restart: unless-stopped
    command: npm run worker
    environment:
      CUSTOMCARD_ENV: prod
      DATABASE_URL: postgres://customcard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/customcard_prod
      QUEUE_URL: redis://redis:6379/0
      OBJECT_STORE_URL: file:///data/objects
      OBJECT_STORE_SIGNING_SECRET: ${OBJECT_STORE_SIGNING_SECRET:?set OBJECT_STORE_SIGNING_SECRET}
      ARTIFACT_SIGNED_URL_TTL_MINUTES: 15
      SECRET_PROVIDER: managed_secret_store
      REAL_ORDER_KILL_SWITCH: disabled
      WALGREENS_VENDOR_MODE: disabled_until_certified
      CVS_VENDOR_MODE: disabled_until_certified
      FEDEX_VENDOR_MODE: disabled_until_certified
      WALMART_VENDOR_MODE: disabled_until_certified
      STAPLES_VENDOR_MODE: disabled_until_certified
      OFFICE_DEPOT_VENDOR_MODE: disabled_until_certified
    volumes:
      - customcard-objects:/data/objects
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: customcard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: customcard_prod
    volumes:
      - customcard-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - customcard-redis:/data

volumes:
  customcard-postgres:
  customcard-redis:
  customcard-objects:
