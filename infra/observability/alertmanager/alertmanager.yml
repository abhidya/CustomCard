# Alertmanager routing for CustomCard ORR alerts.
#
# Critical alerts page (pager receiver); warnings go to the ops chat receiver.
# Secrets are injected via environment at deploy time, never committed. Until a
# real routing key / webhook is provisioned the receivers no-op, which keeps the
# committed config reviewable without claiming a live alert path.
global:
  resolve_timeout: 5m

route:
  receiver: ops-chat
  group_by: ["alertname", "dependency"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: pager
      continue: true
    - matchers:
        - severity = "warning"
      receiver: ops-chat

receivers:
  - name: pager
    pagerduty_configs:
      - routing_key: "${ALERTMANAGER_PAGER_ROUTING_KEY}"
        send_resolved: true

  - name: ops-chat
    slack_configs:
      - api_url: "${ALERTMANAGER_SLACK_WEBHOOK_URL}"
        channel: "#customcard-orr"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})"

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["dependency"]
