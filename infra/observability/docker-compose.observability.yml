# CustomCard metrics platform — self-hosted Prometheus + Alertmanager + Grafana.
#
# This is the deployable ORR (operational readiness review) and business-metrics
# stack. It scrapes the app's `/metrics` endpoint plus blackbox probes for
# critical and non-critical dependencies, evaluates the committed alert/recording
# rules, routes alerts through Alertmanager, and charts everything in Grafana
# from provisioned dashboards.
#
# Bring it up alongside the app on the same Docker network:
#   docker compose \
#     -f infra/docker-compose.droplet.yml \
#     -f infra/observability/docker-compose.observability.yml up -d
#
# Nothing here turns on live external paid telemetry; Prometheus only scrapes
# in-cluster targets. Grafana Cloud / OTLP export remains a separate, evidence
# gated step tracked by the metrics platform register.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - customcard-prometheus:/prometheus
    expose:
      - "9090"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    environment:
      ALERTMANAGER_SLACK_WEBHOOK_URL: ${ALERTMANAGER_SLACK_WEBHOOK_URL:-}
      ALERTMANAGER_PAGER_ROUTING_KEY: ${ALERTMANAGER_PAGER_ROUTING_KEY:-}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - customcard-alertmanager:/alertmanager
    expose:
      - "9093"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    expose:
      - "9115"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - customcard-grafana:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus

volumes:
  customcard-prometheus:
  customcard-alertmanager:
  customcard-grafana:
