# Blackbox exporter probe modules used by Prometheus to keep the ORR
# dependency_up series honest independent of the app process.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      method: GET
      preferred_ip_protocol: ip4

  tcp_connect:
    prober: tcp
    timeout: 5s
