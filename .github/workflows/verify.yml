name: Verify CustomCard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: customcard
          POSTGRES_PASSWORD: customcard
          POSTGRES_DB: customcard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U customcard -d customcard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CUSTOMCARD_ENV: dev
      DATABASE_URL: postgres://customcard:customcard@127.0.0.1:5432/customcard_ci
      QUEUE_URL: redis://x
      OBJECT_STORE_URL: file:///tmp/customcard-objects
      OBJECT_STORE_SIGNING_SECRET: test-object-store-signing-secret-32
      ARTIFACT_SIGNED_URL_TTL_MINUTES: 15
      AUTH_SESSION_SECRET: test-session-secret
      REAL_ORDER_KILL_SWITCH: disabled
      CUSTOMCARD_API_BASE_URL: http://127.0.0.1:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full repository check
        run: npm run check

      - name: Validate deployment readiness
        run: npm run deployment:doctor

      - name: Validate API contract readiness
        run: npm run api:doctor

      - name: Validate API memory runtime
        run: npm run api:doctor:memory

      - name: Validate API Postgres runtime contract
        run: npm run api:doctor:postgres

      - name: Validate live Postgres migration/runtime integration
        run: npm run api:doctor:postgres:live

      - name: Validate persistence readiness
        run: npm run persistence:doctor

      - name: Validate demo reset contract
        run: npm run demo:doctor

      - name: Validate worker readiness
        run: npm run worker

      - name: Validate mobile shell contract
        run: npm --prefix apps/mobile run doctor
