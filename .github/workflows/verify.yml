name: Verify CustomCard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: customcard
          POSTGRES_PASSWORD: customcard
          POSTGRES_DB: customcard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U customcard -d customcard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CUSTOMCARD_ENV: dev
      DATABASE_URL: postgres://customcard:customcard@127.0.0.1:5432/customcard_ci
      QUEUE_URL: redis://x
      OBJECT_STORE_URL: file:///tmp/customcard-objects
      OBJECT_STORE_SIGNING_SECRET: test-object-store-signing-secret-32
      ARTIFACT_SIGNED_URL_TTL_MINUTES: 15
      AUTH_SESSION_SECRET: test-session-secret
      REAL_ORDER_KILL_SWITCH: disabled
      CUSTOMCARD_API_BASE_URL: http://127.0.0.1:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full repository check
        run: npm run check

      - name: Validate deployment readiness
        run: npm run deployment:doctor

      - name: Validate cloud artifact IaC
        run: npm run cloud:doctor

      - name: Validate API contract readiness
        run: npm run api:doctor

      - name: Validate security privacy accessibility baseline
        run: npm run security:doctor

      - name: Validate localization readiness
        run: npm run localization:doctor

      - name: Validate provider cost governance
        run: npm run provider:governance:doctor

      - name: Validate capacity plan readiness
        run: npm run capacity:doctor

      - name: Validate printer pricing research
        run: npm run printer:pricing:doctor

      - name: Validate API memory runtime
        run: npm run api:doctor:memory

      - name: Validate API Postgres runtime contract
        run: npm run api:doctor:postgres

      - name: Validate live Postgres migration/runtime integration
        run: |
          for attempt in 1 2 3 4; do
            if npm run api:doctor:postgres:live; then
              exit 0
            fi
            echo "Live Postgres integration doctor failed on attempt ${attempt}; retrying after a short service settle delay."
            sleep $((attempt * 3))
          done
          npm run api:doctor:postgres:live

      - name: Validate Postgres API HTTP integration
        run: |
          for attempt in 1 2 3 4; do
            if npm run api:doctor:postgres:http; then
              exit 0
            fi
            echo "Postgres API HTTP doctor failed on attempt ${attempt}; retrying after a short service settle delay."
            sleep $((attempt * 3))
          done
          npm run api:doctor:postgres:http

      - name: Validate account auth storage/recovery integration
        run: |
          npm run account:doctor:live || {
            echo "Account auth doctor failed; retrying once after a short service settle delay."
            sleep 3
            npm run account:doctor:live
          }

      - name: Validate artifact object-store writes
        run: npm run artifact:doctor

      - name: Start MinIO artifact service
        run: |
          docker run -d --name customcard-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=customcard \
            -e MINIO_ROOT_PASSWORD=customcard-dev-only \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1 server /data --console-address ":9001"
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs customcard-minio
          exit 1

      - name: Validate live S3-compatible artifact writes
        env:
          OBJECT_STORE_URL: http://127.0.0.1:9000
          OBJECT_STORE_BUCKET: customcard-ci-artifacts
          OBJECT_STORE_ACCESS_KEY_ID: customcard
          OBJECT_STORE_SECRET_ACCESS_KEY: customcard-dev-only
          OBJECT_STORE_REGION: us-east-1
        run: npm run artifact:doctor:s3:live

      - name: Validate persistence readiness
        run: npm run persistence:doctor

      - name: Validate demo reset contract
        run: npm run demo:doctor

      - name: Validate worker readiness
        run: npm run worker

      - name: Validate mobile shell contract
        run: npm --prefix apps/mobile run doctor

      - name: Validate mobile native release contract
        run: npm run mobile:release:doctor
